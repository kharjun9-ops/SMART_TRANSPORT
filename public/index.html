<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
    <meta name="description" content="Lumina Transit - Smart Public Transport Crowd Intelligence & Passenger Assistance System">
    <meta name="theme-color" content="#0c1322">
    <title>Lumina Transit - Crowd Intelligence</title>

    <!-- Tailwind CSS with Lumina Transit Configuration -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-primary-fixed-variant": "#004395",
                        "on-primary": "#002e6a",
                        "surface-tint": "#adc6ff",
                        "surface-container-highest": "#2e3545",
                        "on-tertiary-container": "#3e2400",
                        "error-container": "#93000a",
                        "inverse-primary": "#005ac2",
                        "on-error-container": "#ffdad6",
                        "outline-variant": "#424754",
                        "on-primary-container": "#00285d",
                        "inverse-surface": "#dce2f7",
                        "surface": "#0c1322",
                        "surface-variant": "#2e3545",
                        "secondary-container": "#00a572",
                        "on-primary-fixed": "#001a42",
                        "on-surface-variant": "#c2c6d6",
                        "on-tertiary": "#472a00",
                        "background": "#0c1322",
                        "on-error": "#690005",
                        "secondary-fixed": "#6ffbbe",
                        "on-secondary-fixed": "#002113",
                        "on-tertiary-fixed-variant": "#653e00",
                        "tertiary": "#ffb95f",
                        "surface-bright": "#323949",
                        "tertiary-fixed": "#ffddb8",
                        "error": "#ffb4ab",
                        "primary-fixed": "#d8e2ff",
                        "on-background": "#dce2f7",
                        "primary-container": "#4d8eff",
                        "on-secondary-fixed-variant": "#005236",
                        "surface-container": "#191f2f",
                        "outline": "#8c909f",
                        "primary-fixed-dim": "#adc6ff",
                        "surface-dim": "#0c1322",
                        "on-secondary-container": "#00311f",
                        "tertiary-container": "#ca8100",
                        "surface-container-low": "#141b2b",
                        "tertiary-fixed-dim": "#ffb95f",
                        "on-surface": "#dce2f7",
                        "inverse-on-surface": "#293040",
                        "on-secondary": "#003824",
                        "secondary-fixed-dim": "#4edea3",
                        "surface-container-lowest": "#070e1d",
                        "surface-container-high": "#232a3a",
                        "primary": "#adc6ff",
                        "secondary": "#4edea3",
                        "on-tertiary-fixed": "#2a1700"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1.5rem",
                        "full": "9999px",
                        "transit": "1.5rem"
                    },
                    spacing: {
                        "unit": "4px",
                        "stack-md": "16px",
                        "container-margin": "20px",
                        "stack-lg": "24px",
                        "stack-sm": "8px",
                        "gutter": "16px"
                    },
                    fontFamily: {
                        "sans": ["Inter", "sans-serif"],
                        "body-md": ["Inter", "sans-serif"],
                        "label-bold": ["Inter", "sans-serif"],
                        "label-sm": ["Inter", "sans-serif"],
                        "headline-md": ["Inter", "sans-serif"],
                        "headline-lg": ["Inter", "sans-serif"],
                        "headline-lg-mobile": ["Inter", "sans-serif"],
                        "body-lg": ["Inter", "sans-serif"],
                        "status-number": ["Inter", "sans-serif"]
                    },
                    fontSize: {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-bold": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "status-number": ["24px", { "lineHeight": "24px", "fontWeight": "700" }]
                    }
                }
            }
        };
    </script>

    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Lumina Custom CSS -->
    <link rel="stylesheet" href="/css/index.css">
</head>
<body class="bg-background text-on-background min-h-screen font-body-md relative overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
    <div class="ambient-glow"></div>

    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-content text-center">
            <div class="w-16 h-16 rounded-full bg-primary-container/20 border border-primary/40 flex items-center justify-center mx-auto mb-4 live-pulse">
                <span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">directions_bus</span>
            </div>
            <h1 class="text-2xl font-bold text-primary tracking-tight">Lumina <span class="text-secondary">Transit</span></h1>
            <p class="text-xs text-on-surface-variant mt-1">Real-Time Crowd Intelligence</p>
            <div class="loading-bar mt-4">
                <div class="loading-bar-fill"></div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- App Shell -->
    <div id="app" class="flex flex-col min-h-screen" style="display:none;">

        <!-- TopAppBar (Stitch Lumina Transit Header) -->
        <header id="app-header" class="fixed top-0 w-full flex justify-between items-center px-container-margin h-16 z-50 bg-surface/80 dark:bg-surface/80 backdrop-blur-xl border-b border-white/10">
            <button aria-label="Location" class="text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform p-2 -ml-2 flex items-center justify-center" onclick="if(window.HomeView && window.HomeView.detectGPSLocation){window.HomeView.detectGPSLocation();}else{app.navigate('home');}">
                <span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">location_on</span>
            </button>
            <div class="flex items-center gap-2 cursor-pointer" onclick="app.navigate('home')">
                <div class="w-7 h-7 rounded-lg bg-primary/20 border border-primary/40 flex items-center justify-center">
                    <span class="material-symbols-outlined text-primary text-base" style="font-variation-settings: 'FILL' 1;">directions_bus</span>
                </div>
                <h1 class="font-headline-md text-headline-md-mobile text-primary tracking-tight font-bold">Lumina Transit</h1>
            </div>
            <div class="flex items-center gap-1">
                <button aria-label="Notifications" class="text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform p-2 -mr-2 relative flex items-center justify-center" onclick="app.navigate('profile')">
                    <span class="material-symbols-outlined text-2xl">notifications</span>
                    <span id="notification-badge" class="absolute top-1.5 right-1.5 w-2.5 h-2.5 rounded-full bg-tertiary shadow-[0_0_8px_rgba(255,185,95,0.8)]" style="display:none;"></span>
                </button>
            </div>
        </header>

        <!-- Main Content View Area -->
        <main id="main-content" class="flex-1 w-full min-h-screen">
            <!-- Rendered dynamically by view controllers -->
        </main>

        <!-- Bottom Navigation Bar (Stitch BottomNavBar) -->
        <nav id="bottom-nav" class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe bg-surface/85 backdrop-blur-xl rounded-t-2xl border-t border-white/10 shadow-2xl">
            <!-- Home -->
            <button class="nav-item flex flex-col items-center justify-center text-primary bg-primary-container/20 rounded-xl px-4 py-1 active:scale-90 transition-all w-16" data-view="home" onclick="app.navigate('home')">
                <span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">home</span>
                <span class="font-label-sm text-[11px] mt-0.5 font-medium">Home</span>
            </button>
            <!-- Trips -->
            <button class="nav-item flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 transition-transform px-4 py-1 w-16" data-view="trips" onclick="app.navigate('trips')">
                <span class="material-symbols-outlined text-2xl">route</span>
                <span class="font-label-sm text-[11px] mt-0.5">Trips</span>
            </button>
            <!-- Ranks -->
            <button class="nav-item flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 transition-transform px-4 py-1 w-16" data-view="gamification" onclick="app.navigate('gamification')">
                <span class="material-symbols-outlined text-2xl">military_tech</span>
                <span class="font-label-sm text-[11px] mt-0.5">Ranks</span>
            </button>
            <!-- Report -->
            <button class="nav-item flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 transition-transform px-4 py-1 w-16" data-view="complaints" onclick="app.navigate('complaints')">
                <span class="material-symbols-outlined text-2xl">report_problem</span>
                <span class="font-label-sm text-[11px] mt-0.5">Report</span>
            </button>
            <!-- Profile -->
            <button class="nav-item flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 transition-transform px-4 py-1 w-16" data-view="profile" onclick="app.navigate('profile')">
                <span class="material-symbols-outlined text-2xl">person</span>
                <span class="font-label-sm text-[11px] mt-0.5">Profile</span>
            </button>
        </nav>
    </div>

    <!-- Auth Screen Modal -->
    <div id="auth-screen" class="fixed inset-0 z-[100] bg-surface/95 backdrop-blur-2xl flex items-center justify-center p-4 overflow-y-auto" style="display:none;"></div>

    <!-- General Modal Overlay (For Crowd Feedback Modal etc.) -->
    <div id="modal-overlay" class="fixed inset-0 z-[90] bg-black/70 backdrop-blur-md flex items-center justify-center p-4" style="display:none;" onclick="if(event.target===this)app.closeModal();">
        <div id="modal-content" class="w-full max-w-lg animate-in"></div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/js/utils/api.js"></script>
    <script src="/js/utils/map.js"></script>
    <script src="/js/utils/gps.js"></script>
    <script src="/js/utils/notifications.js"></script>
    <script src="/js/views/auth.js"></script>
    <script src="/js/views/home.js"></script>
    <script src="/js/views/trips.js"></script>
    <script src="/js/views/gamification.js"></script>
    <script src="/js/views/complaints.js"></script>
    <script src="/js/views/profile.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
