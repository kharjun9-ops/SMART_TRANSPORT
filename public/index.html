<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
    <meta name="description" content="Lumina Transit - Smart Public Transport Crowd Intelligence & Passenger Assistance System">
    <meta name="theme-color" content="#ffffff">
    <title>Lumina Transit - Crowd Intelligence</title>

    <!-- Theme Initialization Script (Pre-render) -->
    <script>
        (function() {
            try {
                const theme = localStorage.getItem('lumina_theme') || 'light';
                if (theme === 'light') {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.classList.add('light');
                } else {
                    document.documentElement.classList.remove('light');
                    document.documentElement.classList.add('dark');
                }
            } catch(e) {}
        })();
    </script>

    <!-- Tailwind CSS with Lumina Transit Adaptive Theme Configuration -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface": "var(--color-surface)",
                        "surface-dim": "var(--color-surface-dim)",
                        "surface-bright": "var(--color-surface-bright)",
                        "surface-container-lowest": "var(--color-surface-container-lowest)",
                        "surface-container-low": "var(--color-surface-container-low)",
                        "surface-container": "var(--color-surface-container)",
                        "surface-container-high": "var(--color-surface-container-high)",
                        "surface-container-highest": "var(--color-surface-container-highest)",
                        "surface-variant": "var(--color-surface-container-highest)",
                        "surface-tint": "var(--color-primary)",

                        "on-surface": "var(--color-on-surface)",
                        "on-surface-variant": "var(--color-on-surface-variant)",
                        "outline": "var(--color-outline)",
                        "outline-variant": "var(--color-outline-variant)",

                        "background": "var(--color-surface-dim)",
                        "on-background": "var(--color-on-surface)",

                        "primary": "var(--color-primary)",
                        "primary-container": "var(--color-primary-container)",
                        "on-primary": "var(--color-on-primary)",
                        "on-primary-container": "var(--color-on-primary-container)",
                        "primary-fixed": "var(--color-primary-fixed)",
                        "primary-fixed-dim": "var(--color-primary)",
                        "on-primary-fixed": "var(--color-on-primary-container)",
                        "on-primary-fixed-variant": "var(--color-on-primary-container)",

                        "secondary": "var(--color-secondary)",
                        "secondary-container": "var(--color-secondary-container)",
                        "on-secondary": "var(--color-on-secondary)",
                        "on-secondary-container": "var(--color-on-secondary-container)",
                        "secondary-fixed": "var(--color-secondary)",
                        "secondary-fixed-dim": "var(--color-secondary)",
                        "on-secondary-fixed": "var(--color-on-secondary-container)",
                        "on-secondary-fixed-variant": "var(--color-on-secondary-container)",

                        "tertiary": "var(--color-tertiary)",
                        "tertiary-container": "var(--color-tertiary-container)",
                        "on-tertiary": "var(--color-on-tertiary)",
                        "on-tertiary-container": "var(--color-on-tertiary-container)",
                        "tertiary-fixed": "var(--color-tertiary-container)",
                        "tertiary-fixed-dim": "var(--color-tertiary)",
                        "on-tertiary-fixed": "var(--color-on-tertiary-container)",
                        "on-tertiary-fixed-variant": "var(--color-on-tertiary-container)",

                        "error": "var(--color-error)",
                        "error-container": "var(--color-error-container)",
                        "on-error": "var(--color-on-error)",
                        "on-error-container": "var(--color-on-error-container)",

                        "inverse-surface": "var(--color-on-surface)",
                        "inverse-on-surface": "var(--color-surface)",
                        "inverse-primary": "var(--color-primary)"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1.5rem",
                        "full": "9999px",
                        "transit": "1.5rem"
                    },
                    spacing: {
                        "unit": "4px",
                        "stack-md": "16px",
                        "container-margin": "20px",
                        "stack-lg": "24px",
                        "stack-sm": "8px",
                        "gutter": "16px"
                    },
                    fontFamily: {
                        "sans": ["Inter", "sans-serif"],
                        "body-md": ["Inter", "sans-serif"],
                        "label-bold": ["Inter", "sans-serif"],
                        "label-sm": ["Inter", "sans-serif"],
                        "headline-md": ["Inter", "sans-serif"],
                        "headline-lg": ["Inter", "sans-serif"],
                        "headline-lg-mobile": ["Inter", "sans-serif"],
                        "body-lg": ["Inter", "sans-serif"],
                        "status-number": ["Inter", "sans-serif"]
                    },
                    fontSize: {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-bold": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "status-number": ["24px", { "lineHeight": "24px", "fontWeight": "700" }]
                    }
                }
            }
        };
    </script>

    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Lumina Custom CSS -->
    <link rel="stylesheet" href="/css/index.css">
</head>
<body class="bg-background text-on-background min-h-screen font-body-md relative overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
    <div class="ambient-glow"></div>

    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-content text-center">
            <div class="w-16 h-16 rounded-full bg-primary-container/20 border border-primary/40 flex items-center justify-center mx-auto mb-4 live-pulse">
                <span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">directions_bus</span>
            </div>
            <h1 class="text-2xl font-bold text-primary tracking-tight">Lumina <span class="text-secondary">Transit</span></h1>
            <p class="text-xs text-on-surface-variant mt-1" id="loading-subtitle">Real-Time Crowd Intelligence</p>
            <div class="loading-bar mt-4">
                <div class="loading-bar-fill"></div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- App Shell -->
    <div id="app" class="flex flex-col min-h-screen" style="display:none;">

        <!-- TopAppBar (Lumina Transit Header with Theme Toggle & Notifications) -->
        <header id="app-header" class="fixed top-0 w-full flex justify-between items-center px-container-margin h-16 z-50 bg-surface/90 backdrop-blur-xl border-b border-white/10 shadow-sm transition-colors duration-200">
            <button aria-label="Location" class="text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform p-2 -ml-2 flex items-center justify-center" onclick="if(window.HomeView && window.HomeView.detectGPSLocation){window.HomeView.detectGPSLocation();}else{app.navigate('home');}">
                <span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">location_on</span>
            </button>
            <div class="flex items-center gap-2 px-3 py-1 rounded-full bg-white/5 border border-white/10 shadow-sm cursor-pointer hover:bg-white/10 transition-all" onclick="app.navigate('home')">
                <span class="material-symbols-outlined text-primary text-base" style="font-variation-settings: 'FILL' 1;">directions_bus</span>
                <h1 class="font-bold text-xs tracking-tight text-on-surface" id="app-title-header">Lumina Transit</h1>
            </div>
            <div class="flex items-center gap-1.5">
                <!-- Language Toggle Button (EN / ಕನ್ನಡ / हिन्दी) -->
                <button 
                    aria-label="Toggle Language" 
                    id="lang-toggle-btn"
                    class="text-primary hover:opacity-80 transition-all active:scale-90 px-2 py-1 flex items-center justify-center gap-1 rounded-xl hover:bg-primary-container/20 border border-primary/30 font-bold text-xs cursor-pointer"
                    onclick="app.cycleLanguage()"
                    title="Change Language (English / ಕನ್ನಡ / हिन्दी)"
                >
                    <span class="material-symbols-outlined text-base">translate</span>
                    <span id="lang-toggle-label">EN</span>
                </button>

                <!-- Theme Toggle Button (Google Maps Light / Dark HUD) -->
                <button 
                    aria-label="Toggle Theme" 
                    class="text-primary hover:opacity-80 transition-all active:scale-90 p-2 flex items-center justify-center rounded-xl hover:bg-primary-container/20 cursor-pointer"
                    onclick="ThemeUtils.toggleTheme()"
                    title="Toggle Google Maps Light / Dark HUD Mode"
                >
                    <span class="material-symbols-outlined text-2xl theme-toggle-icon">dark_mode</span>
                </button>

                <!-- Notifications Button -->
                <button aria-label="Notifications" class="text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform p-2 -mr-2 relative flex items-center justify-center cursor-pointer" onclick="app.navigate('profile')">
                    <span class="material-symbols-outlined text-2xl">notifications</span>
                    <span id="notification-badge" class="absolute top-1.5 right-1.5 w-2.5 h-2.5 rounded-full bg-tertiary shadow-[0_0_8px_rgba(234,134,0,0.8)]" style="display:none;"></span>
                </button>
            </div>
        </header>

        <!-- Main Content View Area -->
        <main id="main-content" class="flex-1 w-full min-h-screen">
            <!-- Rendered dynamically by view controllers -->
        </main>

        <!-- Bottom Navigation Bar (BottomNavBar) -->
        <nav id="bottom-nav" class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe bg-surface/90 backdrop-blur-xl rounded-t-2xl border-t border-white/10 shadow-2xl transition-colors duration-200">
            <!-- Home -->
            <button class="nav-item flex flex-col items-center justify-center text-primary bg-primary-container/30 rounded-xl px-4 py-1 active:scale-90 transition-all w-16" data-view="home" onclick="app.navigate('home')">
                <span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">home</span>
                <span class="font-label-sm text-[11px] mt-0.5 font-medium" id="nav-label-home">Home</span>
            </button>
            <!-- Trips -->
            <button class="nav-item flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 transition-transform px-4 py-1 w-16" data-view="trips" onclick="app.navigate('trips')">
                <span class="material-symbols-outlined text-2xl">route</span>
                <span class="font-label-sm text-[11px] mt-0.5" id="nav-label-trips">Trips</span>
            </button>
            <!-- Ranks -->
            <button class="nav-item flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 transition-transform px-4 py-1 w-16" data-view="gamification" onclick="app.navigate('gamification')">
                <span class="material-symbols-outlined text-2xl">military_tech</span>
                <span class="font-label-sm text-[11px] mt-0.5" id="nav-label-ranks">Ranks</span>
            </button>
            <!-- Report -->
            <button class="nav-item flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 transition-transform px-4 py-1 w-16" data-view="complaints" onclick="app.navigate('complaints')">
                <span class="material-symbols-outlined text-2xl">report_problem</span>
                <span class="font-label-sm text-[11px] mt-0.5" id="nav-label-report">Report</span>
            </button>
            <!-- Profile -->
            <button class="nav-item flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 transition-transform px-4 py-1 w-16" data-view="profile" onclick="app.navigate('profile')">
                <span class="material-symbols-outlined text-2xl">person</span>
                <span class="font-label-sm text-[11px] mt-0.5" id="nav-label-profile">Profile</span>
            </button>
        </nav>
    </div>

    <!-- Auth Screen Modal -->
    <div id="auth-screen" class="fixed inset-0 z-[100] bg-surface/95 backdrop-blur-2xl flex items-center justify-center p-4 overflow-y-auto" style="display:none;"></div>

    <!-- General Modal Overlay (For Crowd Feedback Modal etc.) -->
    <div id="modal-overlay" class="fixed inset-0 z-[90] bg-black/70 backdrop-blur-md flex items-center justify-center p-4" style="display:none;" onclick="if(event.target===this)app.closeModal();">
        <div id="modal-content" class="w-full max-w-lg animate-in"></div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/js/data/route_378_road_points.js?v=10"></script>
    <script src="/js/utils/theme.js?v=10"></script>
    <script src="/js/utils/i18n.js?v=10"></script>
    <script src="/js/utils/api.js?v=10"></script>
    <script src="/js/utils/map.js?v=10"></script>
    <script src="/js/utils/gps.js?v=10"></script>
    <script src="/js/utils/notifications.js?v=10"></script>
    <script src="/js/views/auth.js?v=10"></script>
    <script src="/js/views/home.js?v=10"></script>
    <script src="/js/views/trips.js?v=10"></script>
    <script src="/js/views/gamification.js?v=10"></script>
    <script src="/js/views/complaints.js?v=10"></script>
    <script src="/js/views/profile.js?v=10"></script>
    <script src="/js/app.js?v=10"></script>

    <!-- Global language switcher & failsafe auto-dismiss -->
    <script>
    window.switchLang = function(lang) {
        if (!lang) return;
        localStorage.setItem('lumina_lang', lang);
        if (window.I18n) {
            I18n.currentLang = lang;
        }
        window.location.reload();
    };

    // Failsafe auto-dismiss loading screen after 1.5s max
    setTimeout(function() {
        var ls = document.getElementById('loading-screen');
        if (ls && ls.style.display !== 'none') {
            ls.style.opacity = '0';
            setTimeout(function() {
                ls.style.display = 'none';
                var appEl = document.getElementById('app');
                if (appEl) appEl.style.display = 'flex';
                if (window.app && !window.app.activeViewInstance) {
                    window.app.init();
                }
            }, 200);
        }
    }, 1500);
    </script>
</body>
</html>
